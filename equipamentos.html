<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equipamentos</title>
  <link rel="stylesheet" href="./app.css?v=22" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">FleetControl</div>

      <nav class="nav">
        <a class="nav-link" href="./dashboard.html">Dashboard</a>
        <a class="nav-link active" href="./equipamentos.html">Equipamentos</a>
        <a class="nav-link" href="./manutencoes.html">Manutenções</a>
      </nav>

      <button id="btnLogout" class="btn btn-danger full">Sair</button>
    </aside>

    <main class="content">
      <header class="page-header with-actions">
        <div>
          <h1>Equipamentos</h1>
          <p class="muted">Cadastro, edição, exclusão e filtros</p>
        </div>

        <button id="btnNovoEquipamento" class="btn btn-primary">Novo equipamento</button>
      </header>

      <section class="toolbar">
        <div class="toolbar-item">
          <label for="filtroStatusEquipamento">Status</label>
          <select id="filtroStatusEquipamento">
            <option value="">Todos</option>
            <option value="operando">Operando</option>
            <option value="em manutenção">Em manutenção</option>
            <option value="parado">Parado</option>
          </select>
        </div>

        <div class="toolbar-item grow">
          <label for="buscaEquipamento">Buscar</label>
          <input type="text" id="buscaEquipamento" placeholder="Buscar por nome, modelo ou fabricante" />
        </div>

        <div class="toolbar-actions">
          <button id="btnAtualizarEquipamentos" class="btn btn-secondary">Atualizar</button>
        </div>
      </section>

      <section class="panel">
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Fabricante</th>
                <th>Modelo</th>
                <th>Ano</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabelaEquipamentos"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="modalEquipamento" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="tituloModalEquipamento">Novo equipamento</h2>
        <button id="btnFecharModalEquipamento" class="btn-icon" type="button">×</button>
      </div>

      <form id="formEquipamento" class="form-grid">
        <input type="hidden" id="equipamentoId" />

        <div class="form-group">
          <label for="nome">Nome</label>
          <input type="text" id="nome" required />
        </div>

        <div class="form-group">
          <label for="fabricante">Fabricante</label>
          <input type="text" id="fabricante" required />
        </div>

        <div class="form-group">
          <label for="modelo">Modelo</label>
          <input type="text" id="modelo" required />
        </div>

        <div class="form-group">
          <label for="ano">Ano</label>
          <input type="number" id="ano" min="1900" max="2100" required />
        </div>

        <div class="form-group">
          <label for="status">Status</label>
          <select id="status" required>
            <option value="operando">Operando</option>
            <option value="em manutenção">Em manutenção</option>
            <option value="parado">Parado</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="button" id="btnCancelarEquipamento" class="btn btn-secondary">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./config.js?v=22"></script>
  <script src="./common.js?v=22"></script>
  <script src="./equipamentos.js?v=22"></script>
</body>
</html>
